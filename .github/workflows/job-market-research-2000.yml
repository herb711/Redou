name: job-market-research-2000

on:
  push:
    branches:
      - research/job-market-2000-20260710
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout temporary research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parsers
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openpyxl lxml

      - name: Collect and verify company/job records
        run: python research/job_market_2000.py

      - name: Upload research result
        uses: actions/upload-artifact@v4
        with:
          name: cs-job-market-2000
          path: research_output/
          if-no-files-found: error
          retention-days: 7
